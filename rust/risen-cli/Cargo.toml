[package]
name = "risen-cli"
description = "Command-line access to Risen world/template data (list, find, show, edit; --json for agents)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "risen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
risen-formats.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
